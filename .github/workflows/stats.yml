name: 统计定制版检查与构建
on:
  push:
    branches: [main, 'feat/**', 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: sh -n stats-service/openwrt.init && sh -n stats-service/rollback-openwrt.sh
      - run: python3 -m unittest discover -s stats-service -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build:no-fonts
      - run: CHROME_BIN=/usr/bin/google-chrome pnpm test:stats-ui
      - uses: actions/upload-artifact@v4
        with:
          name: zashboard-stats
          path: |
            dist/
            stats-service/service.py
            stats-service/config.example.json
            stats-service/zashboard-stats.service
            stats-service/openwrt.init
            stats-service/rollback-openwrt.sh
            docs/统计服务.md
